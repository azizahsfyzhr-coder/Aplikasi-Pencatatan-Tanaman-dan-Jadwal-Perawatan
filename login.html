
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PlantCare</title>

    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<header class="top-header">
    <img src="logo.png" alt="Logo" class="header-logo">

    <div class="header-title">
        <b>Aplikasi Pencatatan Tanaman dan</b>
        <b>Jadwal Perawatan</b>
    </div>
</header>

<main class="page">

    <div class="login-card">

        <img src="logo.png" alt="Logo PlantCare" class="main-logo">

        <h3>
            Aplikasi Pencatatan Tanaman dan Jadwal<br>
            Perawatan
        </h3>

        <h1>LOGIN</h1>

        <p class="subtitle">
            Login untuk memulai mengelola tanaman harian<br>
            Anda
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="username">Username</label>

                <div class="input-box">
                    <i class="fa-regular fa-user"></i>

                    <input
                        type="text"
                        id="username"
                        placeholder="Masukkan Username"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan Password"
                        required
                    >

                    <i class="fa-regular fa-eye toggle-password"
                       id="togglePassword"></i>
                </div>
            </div>

            <p id="errorMessage"></p>

            <button type="submit" class="login-button">
                Login
            </button>

        </form>

        <div class="register-link">
            <span>Belum punya akun?</span>
            <a href="registrasi.html">Buat akun</a>
        </div>

    </div>

</main>

<script src="login.js"></script>

</body>
</html>
