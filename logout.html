
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - PlantCare</title>

    <link rel="stylesheet" href="logout.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- HEADER -->
<header class="header">

    <div class="brand">
        <img src="logo.png" alt="Logo PlantCare">
        <div>
            <b>Aplikasi Pencatatan Tanaman dan</b>
            <b>Jadwal Perawatan</b>
        </div>
    </div>

    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Cari tanaman, Perawatan, atau Lainnya...">
    </div>

    <div class="header-right">
        <i class="fas fa-user-circle"></i>
        <span>Nama Pengguna</span>
        <i class="fas fa-bell"></i>
        <i class="fas fa-cog"></i>
    </div>

</header>


<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <nav>
            <a href="dashboard.html">
                <i class="fas fa-home"></i> Dashboard
            </a>

            <a href="tanaman.html">
                <i class="fas fa-leaf"></i> Tanaman
            </a>

            <a href="perawatan.html">
                <i class="fas fa-calendar-alt"></i> Perawatan
            </a>

            <a href="riwayat.html">
                <i class="fas fa-history"></i> Riwayat
            </a>

            <a href="laporan.html">
                <i class="fas fa-clipboard-list"></i> Laporan
            </a>

            <a href="logout.html" class="active">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </nav>

    </aside>


    <!-- KONTEN LOGOUT -->
    <main class="content">

        <h1>Logout</h1>
        <p class="breadcrumb">Beranda &gt; Logout</p>

        <div class="logout-container">

            <div class="logout-card">

                <div class="logout-icon">
                    <i class="fas fa-sign-out-alt"></i>
                </div>

                <h2>Konfirmasi Keluar</h2>

                <p>
                    Apakah Anda yakin ingin keluar dari akun Anda?
                </p>

                <div class="logout-buttons">

                    <button class="btn-batal" onclick="batalLogout()">
                        Batal
                    </button>

                    <button class="btn-keluar" onclick="keluarAkun()">
                        Ya, Keluar
                    </button>

                </div>

            </div>

        </div>

    </main>

</div>

<script src="logout.js"></script>

</body>
</html>
